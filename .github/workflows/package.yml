name: package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Verify published package and platform declarations
        run: python3 tools/verify_package_export.py --configure --metadata-tests --check --concurrency-tests --report package-export.json
      - name: Verify exported macOS CoreText oracle
        if: runner.os == 'macOS'
        run: python3 tools/verify_package_export.py --macos-oracle --report package-coretext.json
